# Ruff configuration for resumen-noticias-diario
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "N", "W", "C901"]
ignore = []

# Ratchet de complejidad ciclomática (issues #136, #172): bajarlo al refactorizar.
[lint.mccabe]
max-complexity = 15

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
