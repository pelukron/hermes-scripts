# Ruff configuration for resumen-noticias-diario
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "N", "W", "C901"]
ignore = []

# Ratchet de complejidad ciclomática (issue #136): el tope es el máximo
# medido en main (install_cron.main = 26). No subirlo; bajarlo al refactorizar.
[lint.mccabe]
max-complexity = 26

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
