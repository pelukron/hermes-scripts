name: Auto-release (PSR)

# Releases con python-semantic-release (como examen-egreso-fisica):
# al mergear a main corta versión + tag + GitHub Release desde los commits.
# CHANGELOG.md quedó congelado como registro histórico (lo leen backup-diario
# y la memoria del proyecto); las notas nuevas viven en cada Release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Python
        run: uv python install 3.11

      - name: Install deps
        run: uv sync

      - name: Release (bump + tag + push + publish)
        id: psr
        env:
          # PAT de @pelukron (bypass always en el ruleset). GITHUB_TOKEN no puede
          # pushear a main protegida (GH013) ni eximirse en repos personales (422).
          GH_TOKEN: ${{ secrets.PSR_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta el secret PSR_TOKEN (PAT classic con scope repo). Sin el, PSR no puede pushear el bump a main protegida."
            exit 1
          fi
          # Re-autentica git: el credential-helper del checkout trae GITHUB_TOKEN
          # (bloqueado por el ruleset, GH013) y tiene precedencia sobre la URL.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          TAG_BEFORE=$(git tag --sort=-creatordate | head -1)
          echo "tag_before=$TAG_BEFORE" >> $GITHUB_OUTPUT
          uv run semantic-release version
          TAG_AFTER=$(git tag --sort=-creatordate | head -1)
          echo "tag_after=$TAG_AFTER" >> $GITHUB_OUTPUT

      - name: Sync uv.lock tras el bump
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.PSR_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta el secret PSR_TOKEN para pushear el sync de uv.lock."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock sin cambios"
          else
            git add uv.lock
            git commit -m "chore: sync uv.lock tras release [skip ci]"
            # El credential-helper del checkout trae GITHUB_TOKEN (bloqueado por
            # el ruleset): re-autentica el push con PSR_TOKEN (repo publico, el
            # pull de arriba no necesita auth).
            git config --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:main
          fi

      - name: Link issues (released)
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash bin/link-issue-release.sh \
            --range "${{ steps.psr.outputs.tag_before }}..HEAD" \
            --tag "${{ steps.psr.outputs.tag_after }}"

      - name: Link issues (merged sin release)
        if: steps.psr.outputs.tag_after == steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ steps.psr.outputs.tag_before }}"
          if [ -z "$BASE" ]; then BASE="HEAD~5"; fi
          bash bin/link-issue-release.sh --range "$BASE..HEAD"

      - name: Notificar Telegram
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NL=$'\n'
          TAG="${{ steps.psr.outputs.tag_after }}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          bash bin/notify-telegram.sh "🚀 ${GITHUB_REPOSITORY} ${TAG} publicado${NL}${RELEASE_URL}"
