name: Auto-release (PSR)

# Releases con python-semantic-release (como examen-egreso-fisica):
# al mergear a main corta versión + tag + GitHub Release desde los commits.
# CHANGELOG.md quedó congelado como registro histórico (lo leen backup-diario
# y la memoria del proyecto); las notas nuevas viven en cada Release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Python
        run: uv python install 3.11

      - name: Install deps
        run: uv sync

      - name: Release (bump + tag + push + publish)
        id: psr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_BEFORE=$(git tag --sort=-creatordate | head -1)
          echo "tag_before=$TAG_BEFORE" >> $GITHUB_OUTPUT
          uv run semantic-release version
          TAG_AFTER=$(git tag --sort=-creatordate | head -1)
          echo "tag_after=$TAG_AFTER" >> $GITHUB_OUTPUT

      - name: Sync uv.lock tras el bump
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock sin cambios"
          else
            git add uv.lock
            git commit -m "chore: sync uv.lock tras release [skip ci]"
            git push origin HEAD:main
          fi

      - name: Link issues (released)
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash bin/link-issue-release.sh \
            --range "${{ steps.psr.outputs.tag_before }}..HEAD" \
            --tag "${{ steps.psr.outputs.tag_after }}"

      - name: Link issues (merged sin release)
        if: steps.psr.outputs.tag_after == steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ steps.psr.outputs.tag_before }}"
          if [ -z "$BASE" ]; then BASE="HEAD~5"; fi
          bash bin/link-issue-release.sh --range "$BASE..HEAD"

      - name: Notificar Telegram
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.psr.outputs.tag_after }}
        run: |
          TEXT="$(python3 src/notify_render.py --release)"
          bash bin/notify-telegram.sh "${TEXT}"
