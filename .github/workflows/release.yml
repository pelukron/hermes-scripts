name: Auto-release (PSR)

# Releases con python-semantic-release (como examen-egreso-fisica):
# al mergear a main corta versión + tag + GitHub Release desde los commits.
# CHANGELOG.md quedó congelado como registro histórico (lo leen backup-diario
# y la memoria del proyecto); las notas nuevas viven en cada Release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Python
        run: uv python install 3.11

      - name: Install deps
        run: uv sync

      - name: Release (bump + tag + push + publish)
        id: psr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_BEFORE=$(git tag --sort=-creatordate | head -1)
          echo "tag_before=$TAG_BEFORE" >> $GITHUB_OUTPUT
          uv run semantic-release version
          TAG_AFTER=$(git tag --sort=-creatordate | head -1)
          echo "tag_after=$TAG_AFTER" >> $GITHUB_OUTPUT

      - name: Sync uv.lock tras el bump
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock sin cambios"
          else
            git add uv.lock
            git commit -m "chore: sync uv.lock tras release [skip ci]"
            git push origin HEAD:main
          fi

      - name: Comment on linked issue
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.psr.outputs.tag_after }}"
          ISSUE=$(git log --pretty=%B -5 | grep -oP 'Closes #\K\d+' | head -1)
          if [ -z "$ISSUE" ]; then
            PR_NUM=$(git log -1 --pretty=%s | grep -oP '\(#\K\d+' | head -1)
            if [ -n "$PR_NUM" ]; then
              ISSUE=$(gh pr view "$PR_NUM" --json body --jq '.body' | grep -oP 'Closes #\K\d+' | head -1)
            fi
          fi
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "✅ Released in [$TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG)"
          fi
