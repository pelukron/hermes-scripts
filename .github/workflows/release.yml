name: Auto-release (PSR)

# Releases con python-semantic-release (como examen-egreso-fisica):
# al mergear a main corta versión + tag + GitHub Release desde los commits.
# CHANGELOG.md quedó congelado como registro histórico (lo leen backup-diario
# y la memoria del proyecto); las notas nuevas viven en cada Release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # CAUSA RAÍZ del GH013 (#204): con persist-credentials (default true) el
          # checkout escribe el GITHUB_TOKEN en un config APARTE y lo engancha vía
          # includeIf.gitdir. Ese `http.https://github.com/.extraheader` tiene
          # precedencia sobre las credenciales de la URL, así que el push de PSR
          # salía autenticado como github-actions[bot] (sin rol admin -> GH013)
          # aunque la URL llevara PSR_TOKEN. Desactivarlo es el fix: sin config
          # incluido no hay header que gane, y el push se autentica con PSR_TOKEN.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Python
        run: uv python install 3.11

      - name: Install deps
        run: uv sync --locked

      - name: Release (bump + tag + push + publish)
        id: psr
        env:
          # PAT de @pelukron (bypass always en el ruleset). GITHUB_TOKEN no puede
          # pushear a main protegida (GH013) ni eximirse en repos personales (422).
          GH_TOKEN: ${{ secrets.PSR_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta el secret PSR_TOKEN (PAT classic con scope repo). Sin el, PSR no puede pushear el bump a main protegida."
            exit 1
          fi
          # Re-autentica git por si el checkout volviera a persistir credenciales
          # (ver persist-credentials: false arriba): el header del credential-helper
          # tiene precedencia sobre la URL y el push saldria como github-actions[bot].
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Diagnóstico #204: el error de ruleset no nombra al actor, así que la
          # única prueba de quién empuja es imprimir la identidad de GH_TOKEN y el
          # estado real de las credenciales de git justo antes del push de PSR.
          echo "actor=$(gh api user --jq .login 2>/dev/null || echo 'gh-fallo') id=$(gh api user --jq .id 2>/dev/null || echo '?')"
          echo "extraheader_entries=$(git config --get-all http.https://github.com/.extraheader 2>/dev/null | wc -l | tr -d ' ')"
          echo "origin_url=$(git remote get-url origin | sed -E 's#//[^@]*@#//***@#')"
          TAG_BEFORE=$(git tag --sort=-creatordate | head -1)
          echo "tag_before=$TAG_BEFORE" >> $GITHUB_OUTPUT
          uv run semantic-release -v version
          TAG_AFTER=$(git tag --sort=-creatordate | head -1)
          echo "tag_after=$TAG_AFTER" >> $GITHUB_OUTPUT

      - name: Sync uv.lock tras el bump
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.PSR_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta el secret PSR_TOKEN para pushear el sync de uv.lock."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock sin cambios"
          else
            git add uv.lock
            git commit -m "chore: sync uv.lock tras release [skip ci]"
            # Igual que en el paso Release: el push sale con PSR_TOKEN
            # (repo publico, el pull de arriba no necesita auth).
            git config --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:main
          fi

      - name: Link issues (released)
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash bin/link-issue-release.sh \
            --range "${{ steps.psr.outputs.tag_before }}..HEAD" \
            --tag "${{ steps.psr.outputs.tag_after }}"

      - name: Link issues (merged sin release)
        if: steps.psr.outputs.tag_after == steps.psr.outputs.tag_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ steps.psr.outputs.tag_before }}"
          if [ -z "$BASE" ]; then BASE="HEAD~5"; fi
          bash bin/link-issue-release.sh --range "$BASE..HEAD"

      - name: Notificar Telegram
        if: steps.psr.outputs.tag_after != steps.psr.outputs.tag_before
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.psr.outputs.tag_after }}
        run: |
          TEXT="$(python3 src/notify_render.py --release)"
          bash bin/notify-telegram.sh "${TEXT}"
