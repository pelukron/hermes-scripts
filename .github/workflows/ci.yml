name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install deps
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shellcheck bin/*.sh
        run: shellcheck bin/*.sh

      - name: Changelog check (PSR lo genera al mergear)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'github-actions/')
        run: |
          MERGE_BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo origin/main)
          git diff --name-only "$MERGE_BASE" HEAD | grep -q "^CHANGELOG.md$" && {
            echo "❌ CHANGELOG.md fue modificado en este PR"
            echo ""
            echo "   El changelog y la versión los genera python-semantic-release al mergear."
            echo "   Revierte los cambios a CHANGELOG.md en esta rama."
            exit 1
          } || echo "✅ CHANGELOG.md intacto (lo genera la automatización)"

      - name: Gate
        run: bash bin/gate.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Python
        run: uv python install 3.11

      - name: Install deps
        run: uv sync --locked --python 3.11

      - name: pip-audit
        run: uv run --with pip-audit pip-audit

  notify:
    needs: [test, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notificar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS_TEST="${{ needs.test.result }}"
          STATUS_AUDIT="${{ needs.audit.result }}"
          if [ "$STATUS_TEST" = "success" ] && [ "$STATUS_AUDIT" = "success" ]; then
            EMOJI="✅"
            TEXT="CI pasó: ${{ github.repository }}%0A%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"
          else
            EMOJI="❌"
            TEXT="CI falló: ${{ github.repository }}%0A%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}%0AURL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0Atest=${STATUS_TEST} audit=${STATUS_AUDIT}"
          fi
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${EMOJI} ${TEXT}" \
            -d "parse_mode=HTML"