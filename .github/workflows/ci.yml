name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Disparo manual (#462): permite validar el gate sin abrir un PR. El chequeo del
  # CHANGELOG se salta solo, porque su `if:` exige `github.event_name == 'pull_request'`.
  workflow_dispatch:

# Mínimo privilegio: los jobs solo leen el repo.
permissions:
  contents: read

# En PRs cancela runs obsoletos; en main nunca cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Cache del entorno de uv entre runs (#462): la llave la fija uv.lock, así que
          # un cambio de dependencias invalida la caché en vez de servir un entorno viejo.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install deps
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Install shellcheck
        # Requisito del comando: `make check` corre shellcheck (#265). El paso se queda
        # aquí porque el runner no lo trae; lo que se fue es el shellcheck suelto.
        # Versión del paquete del runner (ubuntu-latest = 24.04 -> shellcheck 0.9.0-1,
        # medido el 2026-09-24 en actions/runner-images Ubuntu2404-Readme.md, #267): si
        # ubuntu-latest migra de base, esto falla ruidoso en vez de cambiar el gate en
        # silencio. Subir el pin es un acto deliberado, igual que las actions por SHA.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck=0.9.0-1

      - name: Changelog check (PSR lo genera al mergear)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'github-actions/')
        run: |
          MERGE_BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo origin/main)
          git diff --name-only "$MERGE_BASE" HEAD | grep -q "^CHANGELOG.md$" && {
            echo "❌ CHANGELOG.md fue modificado en este PR"
            echo ""
            echo "   El changelog y la versión los genera python-semantic-release al mergear."
            echo "   Revierte los cambios a CHANGELOG.md en esta rama."
            exit 1
          } || echo "✅ CHANGELOG.md intacto (lo genera la automatización)"

      - name: Gate
        run: bash bin/gate.sh

      - name: Artefactos del gate
        # `if: always()`: el interés está justo en el run que murió, que es cuando el
        # `bash bin/gate.sh` de arriba no llega al final.
        # `if-no-files-found: warn` mantiene el paso verde si el gate no escribió nada
        # (un rojo en `lint` o en `typecheck` no produce XML). Por eso el DoD se comprueba
        # por la API de artefactos, no por el check verde: un upload vacío pasa igual.
        # `include-hidden-files`: `.artifacts/` es un directorio oculto y el action excluye
        # los archivos ocultos por defecto; sin esto puede subir 0 archivos en silencio.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-artifacts-${{ matrix.python-version }}
          path: .artifacts/
          if-no-files-found: warn
          include-hidden-files: true

  notify:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Notificar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_TEST: ${{ needs.test.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # Texto desde src/notify_render.py (plantillas en config/notify-messages.json,
          # patron hermes-empleo); el envio sigue en bin/notify-telegram.sh.
          TEXT="$(python3 src/notify_render.py --ci)"
          bash bin/notify-telegram.sh "${TEXT}"
