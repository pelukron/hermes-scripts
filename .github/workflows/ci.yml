name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install deps
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shellcheck bin/*.sh
        run: shellcheck bin/*.sh

      - name: Changelog check (PSR lo genera al mergear)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'github-actions/')
        run: |
          MERGE_BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo origin/main)
          git diff --name-only "$MERGE_BASE" HEAD | grep -q "^CHANGELOG.md$" && {
            echo "❌ CHANGELOG.md fue modificado en este PR"
            echo ""
            echo "   El changelog y la versión los genera python-semantic-release al mergear."
            echo "   Revierte los cambios a CHANGELOG.md en esta rama."
            exit 1
          } || echo "✅ CHANGELOG.md intacto (lo genera la automatización)"

      - name: Gate
        run: bash bin/gate.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Python
        run: uv python install 3.11

      - name: Install deps
        run: uv sync --locked --python 3.11

      - name: pip-audit
        run: uv run pip-audit

  notify:
    needs: [test, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notificar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_TEST: ${{ needs.test.result }}
          STATUS_AUDIT: ${{ needs.audit.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          NL=$'\n'
          CHECKS="test=${STATUS_TEST} audit=${STATUS_AUDIT}"
          # En un PR, "ref" es el ref sintetico (<n>/merge): el numero y el enlace reales
          # salen del evento. En un push no hay PR y va el mensaje de siempre.
          if [ "${STATUS_TEST}" = "success" ] && [ "${STATUS_AUDIT}" = "success" ]; then
            if [ -n "${PR_NUMBER}" ]; then
              TEXT="✅ PR #${PR_NUMBER} listo para review${NL}${PR_TITLE}${NL}${PR_URL}${NL}CI en verde (${CHECKS})${NL}Commit: ${SHA}"
            else
              TEXT="✅ CI paso: ${GITHUB_REPOSITORY}${NL}${NL}Branch: ${REF}${NL}Commit: ${SHA}"
            fi
          elif [ -n "${PR_NUMBER}" ]; then
            TEXT="❌ PR #${PR_NUMBER} fallo el CI (${CHECKS})${NL}${PR_TITLE}${NL}${PR_URL}${NL}Run: ${RUN_URL}${NL}Commit: ${SHA}"
          else
            TEXT="❌ CI fallo: ${GITHUB_REPOSITORY}${NL}${NL}Branch: ${REF}${NL}Commit: ${SHA}${NL}URL: ${RUN_URL}${NL}${CHECKS}"
          fi
          # Sin parse_mode: el titulo del PR puede traer <, & o comillas y romperia
          # el parser de HTML de Telegram, justo cuando el aviso importa.
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"