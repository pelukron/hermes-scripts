version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "📦 bump"
      - "🤖 automation"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "🤖 automation"
    # `init`, `autobuild` y `analyze` de CodeQL son un contrato de versión: `init` escribe la
    # configuración que `analyze` lee. Sueltas, un bump que llega sólo tumba main (#453 → #458).
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
