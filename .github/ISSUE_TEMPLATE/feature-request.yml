name: ✨ Feature Request
description: Proponer una nueva funcionalidad o mejora
title: "feat: "
labels: ["✨ enhancement", "priority: p2 · medium", "size: S"]
assignees: [pelukron]
body:
  - type: markdown
    attributes:
      value: |
        El intake aplica `✨ enhancement`, `priority: p2 · medium` y `size: S` por defecto.
        El dropdown de abajo es para que quede escrito en el cuerpo, pero **GitHub no convierte
        la respuesta en label**: si la prioridad no es p2, corrígela al crear
        (`gh issue edit <N> --add-label "priority: p1 · high"`).
  - type: textarea
    id: problem
    attributes:
      label: Problema que resuelve
      description: ¿Qué necesidad cubre? ¿Qué limitación actual hay?
      placeholder: "Ej: Actualmente los issues se crean sin body enriquecido..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solución propuesta
      description: ¿Cómo debería funcionar?
      placeholder: "Ej: Generar un body markdown automático con Summary, Changes, AC..."
  - type: textarea
    id: ac
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] El issue se crea con body completo
        - [ ] Incluye Summary, Changes, AC, Risks
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad declarada
      description: Queda en el cuerpo; la label la aplica el intake por defecto.
      options:
        - priority: p0 · critical
        - priority: p1 · high
        - priority: p2 · medium
        - priority: p3 · low
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      placeholder: Links, referencias, screenshots...
