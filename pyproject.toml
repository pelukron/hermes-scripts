[project]
name = "resumen-noticias-diario"
version = "0.5.5"
description = "Script de resumen diario de noticias multi-región"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "requests",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest",
    "ruff",
    "mypy",
    "bandit",
    "python-semantic-release",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.semantic_release]
version_variable = "pyproject.toml:version"
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]"
commit_parser = "conventional"

[tool.semantic_release.commit_parser_options]
patch_tags = ["fix", "perf", "infra"]
allowed_tags = ["feat", "fix", "perf", "infra", "build", "chore", "ci", "docs", "style", "refactor", "test"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git"]
skips = ["B602", "B604", "B314"]
