[project]
name = "resumen-noticias-diario"
version = "0.18.5"
description = "Script de resumen diario de noticias multi-región"
requires-python = ">=3.11"
# Versiones exactas a proposito: el lock queda reproducible y una dependencia
# vulnerable no entra por resolucion flotante (ver el guard de abajo).
dependencies = [
    "beautifulsoup4==4.15.0",
    "croniter==6.2.4",
    "defusedxml==0.7.1",
    "feedparser==6.0.14",
    "lxml==6.1.3",
    "requests==2.34.2",
]

[project.scripts]
backup-diario = "scripts.backup_diario:main"
cleanup-housekeeping = "scripts.cleanup_housekeeping:main"
monitor-ram-mexico = "scripts.monitor_ram_mexico:main"
polymarket-diario = "scripts.polymarket_diario:main"
reporte-uso-hermes = "scripts.reporte_uso_hermes:main"
resumen-noticias-diario = "scripts.resumen_noticias_diario:main"
resumen-rayados-diario = "scripts.resumen_rayados_diario:main"
resumen-tigres-diario = "scripts.resumen_tigres_diario:main"
sync-runtime = "scripts.sync_runtime:main"

[dependency-groups]
dev = [
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.21",
    "mypy==2.2.0",
    "bandit==1.9.4",
    "python-semantic-release==10.6.2",
    "pip-audit==2.10.1",
]

# Sin guarda de resolver para click (#287): python-semantic-release fija `click~=8.1.0`
# y la excepcion de PYSEC-2026-2132 vive en el target `audit` del Makefile, que es
# donde se juzga el riesgo. El resolver vuelve a seguir a PSR.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_common", "src/scripts"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]"
commit_parser = "conventional"

[tool.semantic_release.commit_parser_options]
patch_tags = ["fix", "perf", "infra"]
allowed_tags = ["feat", "fix", "perf", "infra", "build", "chore", "ci", "docs", "style", "refactor", "test"]
# 2 = LevelBump.PATCH: todo commit convencional corta release (feat sigue minor).
default_bump_level = 2
# Los PRs entran como merge commit con el titulo del PR (2 padres). PSR los descarta
# por default (ignore_merge_commits=True) y las notas del release salian vacias:
# medido en v0.11.5/v0.11.6/v0.12.0, cuya unica linea era el `sync uv.lock`.
ignore_merge_commits = false

[tool.semantic_release.changelog]
template_dir = "templates"
# Ancla de insercion: sin flag PSR deja CHANGELOG.md intacto en silencio.
# Es la ultima version a mano; persiste al reimprimirse en cada update.
insertion_flag = "## [0.5.5] - 2026-09-15"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/__pycache__/*", ".venv/*"]

# Los tests importan sin armarse su propio sys.path (#265).
#
# Medido dentro de pytest (tests/ es un paquete, así que pytest mete la raíz del
# repo la primera): sys.path queda [raíz, src, raíz, …]. Importa menos quién gana
# que el hecho de que gane **siempre el mismo**: `hermes_common` resuelve al shim,
# `cron_canary` / `install_cron` / `healthcheck` a `src/`. Tener las dos identidades
# de `hermes_common` vivas en la misma sesión es el fallo de #251 (test_cron_canary
# metía `REPO/src` al frente y dejaba un `hermes_common` duplicado cacheado en
# sys.modules con su propio `_DEFAULT_SESSION`, y rompía tests ajenos según el orden
# de colección: 5 rojos en un orden y 0 en el inverso).
[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.coverage.report]
show_missing = true

[tool.mypy]
# Sin `python_version` fijo (#267): mypy typechequea con el intérprete que lo corre,
# que en CI es el del job de la matriz. Fijarlo en "3.11" hacía que el job de 3.12
# validara como 3.11 y la matriz mintiera sobre lo que afirma.
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git"]
skips = ["B602", "B604", "B314"]
